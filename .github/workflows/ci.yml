name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "copilot/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  compile:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify lockfile and compile all targets
        run: cargo check --locked --all-targets

      - name: Compile examples
        run: cargo check --locked --examples

      - name: Run library tests on macOS
        if: runner.os == 'macOS'
        run: cargo test --locked --lib

  gpui-rev-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare pinned gpui rev against zed HEAD
        shell: bash
        run: |
          set -euo pipefail
          PINNED_REV="$(sed -n 's/.*gpui = { git = "https:\/\/github.com\/zed-industries\/zed", rev = "\([^"]\+\)".*/\1/p' Cargo.toml | head -n1)"
          HEAD_REV="$(git ls-remote https://github.com/zed-industries/zed HEAD | awk '{print $1}')"
          echo "Pinned rev: $PINNED_REV"
          echo "Latest HEAD: $HEAD_REV"
          if [ "$PINNED_REV" = "$HEAD_REV" ]; then
            echo "gpui pin is up to date."
          else
            echo "::warning::gpui rev drift detected. Consider updating to $HEAD_REV"
          fi
